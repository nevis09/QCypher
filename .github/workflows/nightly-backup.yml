name: Nightly backup + verify

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC every night
  workflow_dispatch:        # allow manual trigger

jobs:
  backup:
    name: pg_dump → R2 → verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install pg_dump
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Install AWS CLI (for R2)
        run: |
          pip install --quiet awscli

      - name: Run backup + verify
        env:
          SUPABASE_DB_URL:        ${{ secrets.SUPABASE_DB_URL }}
          R2_BUCKET:              ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT:            ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID:       ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY:   ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESTORE_DB_URL:         ${{ secrets.RESTORE_DB_URL }}
        run: bash scripts/backup-verify.sh

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Nightly backup failed — check Supabase DB URL and R2 credentials"
