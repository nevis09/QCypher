# Supabase CLI project config
# Run: supabase init (if not already), then supabase db push to apply migrations

[project]
id = "qcypher-micro-crm"

[auth]
enabled = true
# Invite-only: disable sign-ups; tenants are provisioned via server-side invite flow
enable_signup = false
email.enable_confirmations = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[db]
port = 54322
migrations_dir = "../packages/db/migrations"
